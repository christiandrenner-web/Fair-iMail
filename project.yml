# project.yml – XcodeGen Konfiguration für iMail Secure
# Installiere XcodeGen: brew install xcodegen
# Erstelle Projekt:     xcodegen generate --spec project.yml

name: iMailSecure
options:
  bundleIdPrefix: io.imailsecure
  deploymentTarget:
    iOS: "18.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  # XcodeGen schreibt storeKitConfiguration nur in die Launch-Action; das
  # Skript ergänzt sie in der Test-Action, damit UI-Tests echte Testprodukte
  # sehen (siehe Tools/patch-storekit-testaction.py).
  postGenCommand: "python3 Tools/patch-storekit-testaction.py"

settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_BUNDLE_IDENTIFIER: io.imailsecure.app
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_FILE: Sources/iMailSecure/Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: Sources/iMailSecure/Resources/iMailSecure.entitlements
    DEVELOPMENT_TEAM: ""   # ← Deine Team-ID eintragen
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_PREVIEWS: YES
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_LANGUAGE: de
  configs:
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  iMailSecure:
    type: application
    platform: iOS
    sources:
      - path: Sources/iMailSecure
        excludes:
          - "**/.DS_Store"
      # Nur für StoreKit-Tests im Simulator: Die App muss die Konfiguration
      # im Bundle haben, damit SKTestSession sie dem UI-Test zuordnen kann.
      # Der Post-Build-Schritt entfernt sie aus Release-Builds.
      - path: iMailSecure.storekit
        buildPhase: resources
    resources:
      - Sources/iMailSecure/Resources
    dependencies:
      - package: SwiftMail
      - package: swift-log
        product: Logging
    settings:
      base:
        PRODUCT_NAME: iMailSecure
    postBuildScripts:
      - name: StoreKit-Testkonfiguration aus Release entfernen
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            rm -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/iMailSecure.storekit"
          fi

  iMailSecureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/iMailSecureTests
    dependencies:
      - target: iMailSecure
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iMailSecure.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/iMailSecure"

  iMailSecureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/iMailSecureUITests
      - path: iMailSecure.storekit
        buildPhase: resources
    dependencies:
      - target: iMailSecure
    settings:
      base:
        TEST_TARGET_NAME: iMailSecure
        GENERATE_INFOPLIST_FILE: YES

packages:
  SwiftMail:
    url: https://github.com/Cocoanetics/SwiftMail.git
    # Gleicher Pin wie in Package.swift – verhindert, dass ein Resolve
    # stillschweigend auf einen neueren main-Stand springt.
    revision: 88c45cbd31b347b373f7c87e197be63eb95efbc2  # 1.16.0
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: "1.4.0"

schemes:
  iMailSecure:
    build:
      targets:
        iMailSecure: all
    run:
      config: Debug
      storeKitConfiguration: iMailSecure.storekit
    test:
      config: Debug
      storeKitConfiguration: iMailSecure.storekit
      targets:
        - iMailSecureTests
        - iMailSecureUITests
    profile:
      config: Release
    archive:
      config: Release
